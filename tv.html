<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSPL | TV Display</title>
<link rel="icon" href="img/tsilfaviconn.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1630; --card:#13244a; --line:#22386a; --text:#ffffff; --muted:#a9bddc; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --blue:#60a5fa; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Roboto, Arial, sans-serif; overflow:hidden; }
  header { display:flex; align-items:center; justify-content:space-between; padding:2.2vh 3vw; border-bottom:1px solid var(--line); }
  .brand { font-weight:900; font-size:3.2vh; letter-spacing:.5px; } .brand span { color:var(--blue); }
  .slide-title { font-size:3vh; font-weight:500; color:var(--muted); }
  .clock { text-align:right; } .clock b { font-size:3.6vh; display:block; } .clock small { font-size:1.7vh; color:var(--muted); }
  main { height:calc(100% - 15vh); padding:3vh 3vw; }
  .slide { display:none; height:100%; animation: fade .6s ease; } .slide.on { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  .grid { display:grid; gap:2vh 1.6vw; height:100%; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:1.6vh; padding:2.4vh 1.6vw; display:flex; flex-direction:column; gap:1.2vh; position:relative; }
  .unit { font-size:4.4vh; font-weight:900; }
  .lbl { font-size:1.9vh; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .big { font-size:6.4vh; font-weight:900; line-height:1; }
  .mid { font-size:3.4vh; font-weight:700; }
  .sub { font-size:1.9vh; color:var(--muted); }
  .bar { height:1.6vh; background:#0b1630; border-radius:1vh; overflow:hidden; } .bar i { display:block; height:100%; border-radius:1vh; transition: width 1.2s ease; }
  .arrow { font-size:2.2vh; font-weight:700; }
  .rank { display:grid; grid-template-columns: 9vw 1fr 10vw; align-items:center; gap:1.6vw; font-size:4vh; margin-bottom:3vh; }
  .rank .bar { height:5vh; } .rank b { text-align:right; }
  .alert { display:flex; gap:1.4vw; align-items:center; font-size:3vh; padding:2.2vh 1.6vw; border-radius:1.4vh; background:var(--card); border:1px solid var(--line); margin-bottom:1.8vh; }
  .dot { width:2.2vh; height:2.2vh; border-radius:50%; flex:none; }
  footer { position:fixed; left:0; right:0; bottom:0; height:4vh; display:flex; align-items:center; justify-content:space-between; padding:0 3vw; font-size:1.7vh; color:var(--muted); border-top:1px solid var(--line); }
  .dots span { display:inline-block; width:1.2vh; height:1.2vh; border-radius:50%; background:#22386a; margin-left:.8vh; } .dots span.on { background:var(--blue); }
  .help { position:absolute; top:1.4vh; right:1.2vw; width:2.6vh; height:2.6vh; border-radius:50%; border:1px solid var(--line); color:var(--muted); font-size:1.6vh; display:flex; align-items:center; justify-content:center; cursor:help; }
  .help:hover::after { content: attr(data-tip); position:absolute; top:3.2vh; right:0; width:22vw; background:#000c; color:#fff; padding:1vh 1vw; border-radius:.8vh; font-size:1.7vh; line-height:1.35; z-index:5; text-align:left; }
  .msg { display:flex; height:100%; align-items:center; justify-content:center; font-size:3vh; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <div class="brand">TSPL <span>LIVE</span></div>
  <div class="slide-title" id="slideTitle">Loading…</div>
  <div class="clock"><b id="clk">--:--</b><small id="upd">connecting…</small></div>
</header>
<main id="main"><div class="msg">Loading live factory numbers…</div></main>
<footer><span id="src">Source: DPR, COT, DQR and FSA Datamasters · refreshes every 5 minutes</span><span class="dots" id="dots"></span></footer>

<script src="js/tspl-config.js"></script>
<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  var ONLY = (P.get('unit') || '').toUpperCase();          // ?unit=TS4 shows one unit
  var ROTATE = (+P.get('sec') || 15) * 1000;                // ?sec=20 changes rotation time
  var data = null, slides = [], cur = 0, loadedAt = null;
  var C = { good:'#4ade80', warn:'#fbbf24', bad:'#f87171', blue:'#60a5fa' };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function n0(v){ return v == null ? '-' : Math.round(v).toLocaleString('en-IN'); }
  function pct(v){ return v == null ? '-' : (Math.round(v * 10) / 10).toFixed(1) + '%'; }
  function tone(v, good, warn){ return v == null ? C.blue : v >= good ? C.good : v >= warn ? C.warn : C.bad; }
  function dmy(s){ if (!s) return ''; var p = s.split('-'); return p[2] + '-' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]; }

  function jsonp(params, cb){
    var name = '__tv' + Date.now(), s = document.createElement('script'), done = false;
    window[name] = function (r) { done = true; window[name] = function(){}; cb(r); };
    s.src = window.TSPL_MONITOR_URL + '?' + Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&') + '&callback=' + name + '&_=' + Date.now();
    s.onerror = function(){ if (!done) cb(null); };
    setTimeout(function(){ if (!done) { window[name] = function(){}; cb(null); } }, 90000);
    document.body.appendChild(s);
  }

  function spark(arr, color){
    if (!arr || arr.length < 2) return '';
    var w = 200, h = 44, vals = arr.map(function(x){ return Math.max(0, Math.min(100, x.eff)); }), mn = Math.min.apply(0, vals) - 2, mx = Math.max.apply(0, vals) + 2;
    var pts = vals.map(function(v, i){ return (i / (vals.length - 1) * w).toFixed(1) + ',' + (h - (v - mn) / (mx - mn) * h).toFixed(1); }).join(' ');
    var last = pts.split(' ').pop().split(',');
    return '<svg viewBox="0 0 ' + w + ' ' + (h + 4) + '" preserveAspectRatio="none" style="width:100%;height:13vh" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + color + '"/></svg>';
  }
  function arrow(now, prev, label){
    if (now == null || prev == null) return '';
    var d = Math.round((now - prev) * 10) / 10, up = d >= 0;
    return '<span class="arrow" style="color:' + (up ? C.good : C.bad) + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(d).toFixed(1) + ' pts</span> <span class="sub">' + label + '</span>';
  }
  function countUp(root){
    root.querySelectorAll('[data-count]').forEach(function (el) {
      var to = parseFloat(el.getAttribute('data-count')), dec = +el.getAttribute('data-dec') || 0, suf = el.getAttribute('data-suf') || '', t0 = null;
      if (isNaN(to)) return;
      function step(ts){ t0 = t0 || ts; var k = Math.min(1, (ts - t0) / 1200), v = to * (1 - Math.pow(1 - k, 3));
        el.textContent = (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-IN')) + suf; if (k < 1) requestAnimationFrame(step); }
      var fin = (dec ? to.toFixed(dec) : Math.round(to).toLocaleString('en-IN')) + suf;
      if (document.hidden) { el.textContent = fin; return; }
      requestAnimationFrame(step);
      setTimeout(function(){ el.textContent = fin; }, 1600);
    });
  }
  function num(v, dec, suf){ return v == null ? '<span>-</span>' : '<span data-count="' + v + '" data-dec="' + (dec || 0) + '" data-suf="' + (suf || '') + '">0</span>'; }

  function build(){
    var U = data.units.filter(function(u){ return !ONLY || u.unit === ONLY; });
    slides = [];
    // 1. unit overview
    slides.push({ title: 'Units - production & efficiency', html:
      '<div class="grid" style="grid-template-columns:repeat(' + Math.min(U.length, 5) + ',minmax(0,1fr))">' + U.map(function (u) {
        var ach = u.tgt ? u.pro / u.tgt * 100 : null, t = data.trend[u.unit] || [], prev = t.length > 1 ? t[t.length - 2].eff : null;
        return '<div class="card"><div class="unit">' + esc(u.unit) + '</div>' +
          '<div class="help" data-tip="Output vs target = pieces produced / unit target on the latest DPR day (' + dmy(data.prodDate) + '). Efficiency = earned minutes / available minutes (COT sheet).">?</div>' +
          '<div><div class="lbl">Output vs target</div><div class="big" style="color:' + tone(ach, 98, 90) + '">' + num(ach, 1, '%') + '</div>' +
          '<div class="bar" style="margin-top:1vh"><i style="width:' + Math.min(ach || 0, 100) + '%;background:' + tone(ach, 98, 90) + '"></i></div>' +
          '<div class="sub" style="margin-top:.6vh">' + n0(u.pro) + ' of ' + n0(u.tgt) + ' pcs · ' + dmy(data.prodDate) + '</div></div>' +
          '<div style="margin-top:auto;border-top:1px solid #22386a;padding-top:2vh"><div class="lbl">Efficiency · ' + dmy(data.effDate) + '</div><div class="big" style="font-size:5.2vh;color:' + tone(u.eff, 55, 45) + '">' + num(u.eff, 1, '%') + '</div>' +
          '<div class="sub" style="margin-top:1vh">Last ' + t.length + ' days</div>' + spark(t, C.blue) + '<div>' + arrow(u.eff, prev, 'vs day before') + '</div>' +
          '<div>' + arrow(u.effMtd, u.effPrevMonth, 'this month vs last') + '</div></div></div>';
      }).join('') + '</div>' });
    // 2. efficiency ranking
    var R = U.filter(function(u){ return u.eff != null; }).sort(function(a, b){ return b.eff - a.eff; });
    slides.push({ title: 'Efficiency ranking · ' + dmy(data.effDate), html: R.length ? R.map(function (u) {
        return '<div class="rank"><span style="font-weight:900">' + esc(u.unit) + '</span><div class="bar"><i style="width:' + Math.min(u.eff, 100) + '%;background:' + tone(u.eff, 55, 45) + '"></i></div><b>' + num(u.eff, 1, '%') + '</b></div>';
      }).join('') + '<div class="sub" style="font-size:2vh">Green 55% and above · amber 45-55% · red below 45%. Efficiency = earned minutes / available minutes.</div>' : '<div class="msg">No efficiency data yet.</div>' });
    // 3. quality
    slides.push({ title: 'Quality - month to date', html:
      '<div class="grid" style="grid-template-columns:repeat(' + Math.min(U.length, 5) + ',minmax(0,1fr))">' + U.map(function (u) {
        return '<div class="card"><div class="unit">' + esc(u.unit) + '</div>' +
          '<div class="help" data-tip="FTR = first-time-right passed pieces / checked pieces (DQR). FSA pass % = passed final audits / (passed + failed) this month.">?</div>' +
          '<div><div class="lbl">End-line FTR</div><div class="big" style="color:' + tone(u.ftr, 95, 90) + '">' + (u.ftr == null ? '<span style="font-size:3vh;color:#a9bddc">No DQR data</span>' : num(u.ftr, 1, '%')) + '</div>' +
          '<div class="sub">' + (u.ftrChk ? n0(u.ftrChk) + ' pcs checked' : '') + '</div></div>' +
          '<div style="margin-top:auto"><div class="lbl">FSA pass rate</div><div class="mid" style="color:' + tone(u.fsa, 85, 70) + '">' + (u.fsa == null ? '<span style="font-size:2.6vh;color:#a9bddc">No audits yet</span>' : num(u.fsa, 1, '%')) + '</div>' +
          '<div class="sub">' + (u.fsaN ? (u.fsaPass || 0) + ' pass / ' + (u.fsaFail || 0) + ' fail' : '') + '</div></div></div>';
      }).join('') + '</div>' });
    // 4. exceptions
    var ex = [];
    U.forEach(function (u) {
      var ach = u.tgt ? u.pro / u.tgt * 100 : null;
      if (ach != null && ach < 90) ex.push([C.bad, u.unit + ' at ' + pct(ach) + ' of target', n0(u.tgt - u.pro) + ' pcs short on ' + dmy(data.prodDate)]);
      if (u.eff != null && u.eff < 45) ex.push([C.warn, u.unit + ' efficiency ' + pct(u.eff), 'below 45% on ' + dmy(data.effDate)]);
      if (u.ftr == null) ex.push(['#94a3b8', u.unit + ' has no end-line quality (DQR) data this month', 'check DQR entry']);
    });
    if (data.openIssues) ex.push([C.bad, data.openIssues + ' program issue(s) open', 'see the bell on the HO dashboard']);
    slides.push({ title: 'Needs attention', html: ex.length ? ex.slice(0, 7).map(function (e) {
        return '<div class="alert"><span class="dot" style="background:' + e[0] + '"></span><div><b>' + esc(e[1]) + '</b><div class="sub">' + esc(e[2]) + '</div></div></div>';
      }).join('') : '<div class="msg" style="color:#4ade80">All units on track. Well done!</div>' });
    document.getElementById('dots').innerHTML = slides.map(function(_, i){ return '<span class="' + (i === cur ? 'on' : '') + '"></span>'; }).join('');
  }
  function show(i){
    if (!slides.length) return;
    cur = i % slides.length;
    var m = document.getElementById('main');
    m.innerHTML = '<div class="slide on">' + slides[cur].html + '</div>';
    document.getElementById('slideTitle').textContent = slides[cur].title;
    document.querySelectorAll('#dots span').forEach(function(d, k){ d.className = k === cur ? 'on' : ''; });
    countUp(m);
  }
  function load(){
    jsonp({ action: 'kpis' }, function (r) {
      if (r && r.ok) { data = r; loadedAt = Date.now(); build(); show(cur); }
      else { if (!data) document.getElementById('main').innerHTML = '<div class="msg">Still collecting the live numbers. Trying again in 1 minute…</div>'; setTimeout(load, 60000); }
    });
  }
  setInterval(function(){
    var d = new Date(); document.getElementById('clk').textContent = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    if (loadedAt) { var m = Math.floor((Date.now() - loadedAt) / 60000); document.getElementById('upd').textContent = m < 1 ? 'updated just now' : 'updated ' + m + ' min ago'; }
  }, 1000);
  setInterval(function(){ if (slides.length) show(cur + 1); }, ROTATE);
  setInterval(load, 5 * 60000);
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1 + slides.length); if (e.key === 'f') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });
  load();
})();
</script>
</body>
</html>
