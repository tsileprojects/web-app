<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSPL | Daily Report</title>
<link rel="icon" href="img/tsilfaviconn.png" type="image/png">
<link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
<style>
  :root { --bg:#f4f7fb; --card:#fff; --line:#e2e8f0; --text:#0f172a; --muted:#5b6577; --brand:#2196f3; --good:#15803d; --warn:#b45309; --bad:#b91c1c; --head:#f1f5f9; }
  html.tspl-dark { --bg:#0f172a; --card:#111c33; --line:#263552; --text:#e5e7eb; --muted:#9fb0c8; --head:#16223d; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
  h1 { font-size:18px; margin:0; } h1 span { color:var(--brand); }
  .meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; }
  button, select, input, textarea { font:inherit; font-size:13px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { padding:7px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  button:hover { border-color:var(--brand); }
  button.pri { background:var(--brand); color:#fff; border-color:var(--brand); }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 24px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  h2 small { font-weight:400; color:var(--muted); font-size:12.5px; }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; background:var(--head); }
  th:first-child, td:first-child, td.l, th.l { text-align:left; }
  td.wrapc { white-space:normal; min-width:160px; text-align:left; }
  tr.click { cursor:pointer; } tr.click:hover td { background:rgba(33,150,243,.07); } tr.sel td { background:rgba(33,150,243,.12); }
  tr.tot td { font-weight:700; background:var(--head); }
  .g { color:var(--good); font-weight:700; } .a { color:var(--warn); font-weight:700; } .r { color:var(--bad); font-weight:700; } .m { color:var(--muted); }
  .up { color:var(--good); } .dn { color:var(--bad); }
  .note-ic { color:var(--brand); margin-left:6px; font-size:12px; }
  .hint { font-size:12.5px; color:var(--muted); margin:8px 0 0; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .notes { list-style:none; margin:0; padding:0; max-height:340px; overflow:auto; }
  .notes li { padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .notes li b { margin-right:6px; } .notes .when { color:var(--muted); font-size:12px; }
  form.addn { display:grid; gap:8px; grid-template-columns: 110px 90px 1fr; }
  form.addn textarea { grid-column:1 / -1; min-height:60px; padding:8px; resize:vertical; }
  form.addn input, form.addn select { padding:7px 8px; }
  form.addn .row { grid-column:1 / -1; display:flex; gap:8px; align-items:center; }
  form.addn .row input { flex:1; }
  .msg { padding:30px; text-align:center; color:var(--muted); }
  .flash { font-size:12.5px; margin-left:6px; }
  .print-only { display:none; }
  .hb { display:flex; align-items:flex-end; gap:2px; height:22px; min-width:72px; } .hb i { flex:1; background:#93c5fd; border-radius:2px 2px 0 0; min-height:2px; } .hb i.z { background:#e2e8f0; }
  .live { display:inline-block; background:#dc2626; color:#fff; font-size:10.5px; font-weight:700; border-radius:9px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
  h3.sub2 { font-size:14px; margin:18px 0 8px; }
  @media (max-width:860px) { .grid2 { grid-template-columns:1fr; } form.addn { grid-template-columns:1fr 1fr; } }
  @media print {
    header { position:static; border:0; } .acts, form.addn, .no-print { display:none !important; }
    body { background:#fff; color:#000; } .card { border:1px solid #ccc; break-inside:avoid; } .print-only { display:block; }
    .wrap { padding:0; max-width:none; } .notes { max-height:none; }
  }
</style>
<script>try { if (localStorage.getItem('tsplTheme') === 'dark') document.documentElement.classList.add('tspl-dark'); } catch (e) {}</script>
<script src="js/i18n.js"></script>
</head>
<body>
<header>
  <div><h1>TSPL | <span data-i18n="dailyReport">Daily Report</span></h1><div class="meta" id="meta" data-i18n="loading">Loading…</div></div>
  <div class="acts">
    <select id="mode" aria-label="Which day" style="padding:7px 10px"><option value="today">Today (live)</option><option value="last">Last full day</option><option value="date">Pick a date…</option></select>
    <input type="date" id="day" hidden style="padding:6px 8px">
    <button type="button" id="btnXls"><i class="las la-file-excel"></i><span data-i18n="downloadXls">Download Excel</span></button>
    <button type="button" id="btnPdf"><i class="las la-print"></i><span data-i18n="printPdf">Print / PDF</span></button>
    <button type="button" id="btnRe" title="Read the latest hourly production from the DPR now"><i class="las la-sync"></i><span>Update now</span></button>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <h2><span data-i18n="dailyReport">Daily Report</span> <small id="dates"></small></h2>
    <div class="tw" id="sum"><div class="msg" data-i18n="loading">Loading…</div></div>
    <p class="hint no-print">Click a unit to see its line-wise and product-wise detail.</p>
  </div>
  <div class="card" id="drillCard" hidden>
    <h2><span id="drillTitle"></span> <small id="drillSub"></small></h2>
    <div class="tw" id="drill"></div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2><i class="las la-sticky-note"></i><span data-i18n="notes">Notes</span> <small>(31 days)</small></h2>
      <ul class="notes" id="notes"><li class="m" data-i18n="loading">Loading…</li></ul>
    </div>
    <div class="card no-print">
      <h2><i class="las la-plus-circle"></i><span data-i18n="addNote">Add a note</span></h2>
      <form class="addn" id="noteForm" autocomplete="off">
        <select id="nUnit" aria-label="Unit"></select>
        <input id="nLine" placeholder="Line" aria-label="Line" maxlength="10" data-i18n-ph="line">
        <input id="nDate" type="date" aria-label="Date">
        <textarea id="nText" maxlength="300" data-i18n-ph="notePh" aria-label="Note"></textarea>
        <div class="row"><input id="nBy" maxlength="40" data-i18n-ph="yourName" aria-label="Your name"><button class="pri" type="submit"><i class="las la-save"></i><span data-i18n="save">Save note</span></button><span class="flash" id="nFlash"></span></div>
      </form>
    </div>
  </div>
</div>

<script src="js/tspl-config.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TSPL_T || function (k) { return k; };
  if (window.TSPL_I18N) TSPL_I18N.apply();
  var UNITS = ['AP2', 'FIPL', 'TS2', 'TS4', 'TS9'];
  var ONLY = (new URLSearchParams(location.search).get('unit') || '').toUpperCase();
  var R = null, NOTES = [], DR = null, loadedAt = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(v) { return v == null || v === '' ? '-' : Math.round(v).toLocaleString('en-IN'); }
  function p1(v) { return v == null ? '-' : (Math.round(v * 10) / 10).toFixed(1) + '%'; }
  function cls(v, g, a) { return v == null ? 'm' : v >= g ? 'g' : v >= a ? 'a' : 'r'; }
  function dmy(s) { if (!s) return ''; var p = String(s).split('-'); return p[2] + '-' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1] + '-' + p[0].slice(2); }
  function delta(a, b) { if (a == null || b == null) return '<span class="m">-</span>'; var d = Math.round((a - b) * 10) / 10; return '<span class="' + (d >= 0 ? 'up' : 'dn') + '">' + (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + '</span>'; }

  function jsonp(params, cb, ms) {
    var name = '__rp' + Date.now() + Math.floor(Math.random() * 1000), s = document.createElement('script'), done = false;
    window[name] = function (r) { done = true; window[name] = function () {}; cb(r); };
    s.src = window.TSPL_MONITOR_URL + '?' + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&') + '&callback=' + name + '&_=' + Date.now();
    s.onerror = function () { if (!done) { done = true; cb(null); } };
    setTimeout(function () { if (!done) { done = true; window[name] = function () {}; cb(null); } }, ms || 100000);
    document.body.appendChild(s);
  }

  var MODE = new URLSearchParams(location.search).get('date') ? 'date' : 'today', PD = null, DAY = new URLSearchParams(location.search).get('date') || '';
  function units() { return (R.k.units || []).filter(function (u) { return !ONLY || u.unit === ONLY; }); }
  function notesFor(unit, date) { return NOTES.filter(function (n) { return n.unit === unit && (!date || n.date === date); }); }
  function prodOf(unit) {
    if (MODE === 'last') return (R.p.units || {})[unit] || {};
    var x = PD && PD.units ? PD.units.filter(function (u) { return u.unit === unit; })[0] : null;
    return x || {};
  }
  function prodDate() { return MODE === 'last' ? R.p.date : PD ? PD.date : DAY; }
  function isLive() { return MODE === 'today'; }
  function hbars(h) { if (!h || !h.length) return ''; var mx = Math.max.apply(0, h.concat([1])); return '<div class="hb" title="Pieces per hour (1st-9th)">' + h.map(function (v, i) { return '<i class="' + (v ? '' : 'z') + '" style="height:' + Math.max(8, v / mx * 100) + '%" title="Hour ' + (i + 1) + ': ' + n0(v) + '"></i>'; }).join('') + '</div>'; }

  function renderSummary() {
    var k = R.k, tp = 0, tt = 0, live = isLive();
    if (!live || PD) document.getElementById('dates').innerHTML = T('output') + ': ' + (live ? 'today ' + dmy(prodDate()) + ' as of ' + esc(PD.time) + '<span class="live">LIVE</span>' : dmy(prodDate())) + ' · ' + T('efficiency') + ': ' + dmy(k.effDate) + ' (last full day) · ' + T('quality');
    if (live && !PD) { document.getElementById('sum').innerHTML = '<div class="msg">' + T('loading') + '</div>'; return; }
    var rows = units().map(function (u) {
      var x = prodOf(u.unit), ach = x.tgt ? x.pro / x.tgt * 100 : null, t = (k.trend || {})[u.unit] || [], prev = t.length > 1 ? t[t.length - 2].eff : null;
      var exp = live && x.tgt && x.hoursDone ? x.tgt * x.hoursDone / 9 : null, pace = exp ? x.pro / exp * 100 : null;
      tp += x.pro || 0; tt += x.tgt || 0;
      var nn = notesFor(u.unit, prodDate()).length;
      return '<tr class="click' + (DR && DR.unit === u.unit ? ' sel' : '') + '" data-u="' + u.unit + '"><td><b>' + u.unit + '</b>' + (nn ? '<i class="las la-sticky-note note-ic" title="' + T('notes') + '"></i>' : '') + '</td>' +
        '<td>' + n0(x.pro) + '</td><td>' + n0(x.tgt) + '</td><td class="' + (live ? '' : cls(ach, 98, 90)) + '">' + p1(ach) + '</td>' +
        (live ? '<td>' + (x.hoursDone ? x.hoursDone + ' / 9' : '-') + '</td><td class="' + cls(pace, 98, 90) + '">' + p1(pace) + '</td><td>' + hbars(x.hours) + '</td>' : '') +
        '<td class="' + cls(u.eff, 55, 45) + '">' + p1(u.eff) + '</td><td>' + delta(u.eff, prev) + '</td><td>' + p1(u.effMtd) + '</td><td>' + delta(u.effMtd, u.effPrevMonth) + '</td>' +
        '<td class="' + (u.ftr == null ? 'm' : cls(u.ftr, 95, 90)) + '">' + (u.ftr == null ? T('noDqr') : p1(u.ftr)) + '</td>' +
        '<td class="' + (u.fsa == null ? 'm' : cls(u.fsa, 85, 70)) + '">' + (u.fsa == null ? T('noAudits') : p1(u.fsa)) + '</td></tr>';
    }).join('');
    var ta = tt ? tp / tt * 100 : null;
    var tot = ONLY ? '' : '<tr class="tot"><td>TSPL</td><td>' + n0(tp) + '</td><td>' + n0(tt) + '</td><td>' + p1(ta) + '</td><td colspan="' + (live ? 10 : 7) + '"></td></tr>';
    document.getElementById('sum').innerHTML = '<table><thead><tr><th>' + T('unit') + '</th><th>' + T('output') + '</th><th>' + T('target') + '</th><th>' + (live ? 'Of day target' : T('achieved')) + '</th>' +
      (live ? '<th>Hour</th><th>Pace</th><th>Per hour</th>' : '') +
      '<th>Eff (' + dmy(k.effDate) + ')</th><th>' + T('vsDayBefore') + '</th><th>' + T('thisMonth') + '</th><th>vs last month</th><th>' + T('ftr') + '</th><th>' + T('fsa') + '</th></tr></thead><tbody>' + rows + tot + '</tbody></table>';
  }

  function renderNotes() {
    var list = NOTES.filter(function (n) { return !ONLY || n.unit === ONLY || n.unit === 'TSPL'; });
    document.getElementById('notes').innerHTML = list.length ? list.slice(0, 80).map(function (n) {
      return '<li><b>' + esc(n.unit) + (n.line ? ' · ' + T('line') + ' ' + esc(n.line) : '') + '</b>' + esc(n.text) + '<div class="when">' + dmy(n.date) + ' · ' + esc(n.by) + '</div></li>';
    }).join('') : '<li class="m">' + T('noNotes') + '</li>';
  }

  var HOURLY = false, OPENP = {};
  function openDrill(unit, quiet, fresh) {
    var date = prodDate();
    var card = document.getElementById('drillCard');
    card.hidden = false;
    document.getElementById('drillTitle').textContent = unit + ' · line-wise & product-wise';
    if (!quiet) document.getElementById('drill').innerHTML = '<div class="msg">' + T('loading') + '</div>';
    if (!DR || DR.unit !== unit) OPENP = {};
    DR = { unit: unit, date: date, lines: DR && DR.unit === unit ? DR.lines : null, products: DR && DR.unit === unit ? DR.products : null, r: DR && DR.unit === unit ? DR.r : null }; renderSummary();
    if (!quiet) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var ub = document.getElementById('bUpd'); if (ub) { ub.disabled = true; ub.textContent = 'Updating…'; }
    var params = { action: 'drill', unit: unit, date: date }; if (fresh) params.fresh = 1;
    jsonp(params, function (r) {
      if (!r || !r.ok) { document.getElementById('drill').innerHTML = '<div class="msg">' + esc(r && r.error || T('tryAgain')) + '</div>'; return; }
      DR.r = r; DR.lines = r.lines || []; DR.products = r.products || [];
      renderDrill();
    }, 120000);
  }
  function hcell(v) { return v ? n0(v) : '<span class="m">-</span>'; }
  function renderDrill() {
    var r = DR.r, unit = DR.unit, date = DR.date, live = r.live;
    document.getElementById('drillSub').innerHTML = dmy(date) + (live ? '<span class="live">LIVE</span> as of ' + esc(r.time) : '');
    var ln = notesFor(unit, date);
    var tp = 0, tt = 0, te = 0, ta = 0, tex = 0, tpx = 0, hsum = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var tools = '<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">' +
      '<button type="button" id="bUpd" title="Read the latest hourly production from the DPR now">&#8635; Update now</button>' +
      '<button type="button" id="bHourly" class="' + (HOURLY ? 'pri' : '') + '" style="' + (HOURLY ? 'background:#2196f3;color:#fff;border-color:#2196f3' : '') + '">&#9201; Hourly view' + (HOURLY ? ' (on)' : '') + '</button>' +
      '<span class="m" style="font-size:12px;align-self:center">' + (live ? 'Live as of ' + esc(r.time) + ' · auto-refresh every 5 min' : 'Day: ' + dmy(date)) + '</span></div>';
    var head, body, tot;
    if (HOURLY) {
      head = '<table><thead><tr><th>' + T('line') + '</th><th class="l">' + T('style') + '</th>' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (h) { return '<th>H' + h + '</th>'; }).join('') + '<th>Total</th><th>' + T('target') + '</th><th>Of target</th></tr></thead><tbody>';
      body = DR.lines.map(function (l) {
        var hs = l.hours || []; hs.forEach(function (v, i) { hsum[i] += v || 0; }); tp += l.pro || 0; tt += l.tgt || 0;
        return '<tr><td><b>' + esc(l.line) + '</b></td><td class="l">' + esc(l.style) + '</td>' + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (i) { return '<td>' + hcell(hs[i]) + '</td>'; }).join('') +
          '<td><b>' + n0(l.pro) + '</b></td><td>' + n0(l.tgt) + '</td><td>' + p1(l.tgt ? l.pro / l.tgt * 100 : null) + '</td></tr>';
      }).join('');
      tot = '<tr class="tot"><td>' + esc(unit) + '</td><td>pcs per hour</td>' + hsum.map(function (v) { return '<td>' + hcell(v) + '</td>'; }).join('') + '<td>' + n0(tp) + '</td><td>' + n0(tt) + '</td><td>' + p1(tt ? tp / tt * 100 : null) + '</td></tr></tbody></table>';
    } else {
      head = '<table><thead><tr><th>' + T('line') + '</th><th class="l">' + T('buyer') + '</th><th class="l">' + T('style') + '</th><th class="l">Status</th><th>' + T('output') + '</th><th>' + T('target') + '</th><th>' + (live ? 'Of day target' : T('achieved')) + '</th>' +
        (live ? '<th>Hour</th><th>Pace</th><th>Per hour</th>' : '<th>' + T('efficiency') + '</th>') + '<th>' + T('mp') + '</th><th>' + T('ftr') + '</th><th>' + T('dft') + '</th><th class="l">' + T('remark') + '</th></tr></thead><tbody>';
      body = DR.lines.map(function (l) {
        var ach = l.tgt ? l.pro / l.tgt * 100 : null; tp += l.pro || 0; tt += l.tgt || 0; te += l.earn || 0; ta += l.avail || 0;
        var exp = live && l.tgt && l.hoursDone ? l.tgt * l.hoursDone / 9 : null, pace = exp ? l.pro / exp * 100 : null; if (exp) { tex += exp; tpx += l.pro || 0; }
        var nts = ln.filter(function (n) { return n.line && String(n.line).toUpperCase() === String(l.line).toUpperCase(); }).map(function (n) { return n.text; });
        var rem = [l.remark].concat(nts).filter(function (x) { return x && !/^(na|n\/a|-|0)$/i.test(String(x).trim()); }).join(' | ');
        return '<tr><td><b>' + esc(l.line) + '</b></td><td class="l">' + esc(l.buyer) + '</td><td class="l">' + esc(l.style) + '</td><td class="l">' + esc(l.status || '') + '</td><td>' + n0(l.pro) + '</td><td>' + n0(l.tgt) + '</td><td class="' + (live ? '' : cls(ach, 98, 90)) + '">' + p1(ach) + '</td>' +
          (live ? '<td>' + (l.hoursDone ? l.hoursDone + '/9' : '-') + '</td><td class="' + cls(pace, 98, 90) + '">' + p1(pace) + '</td><td>' + hbars(l.hours) + '</td>' : '<td class="' + cls(l.eff, 55, 45) + '">' + p1(l.eff) + '</td>') +
          '<td>' + n0(l.mp) + '</td><td class="' + cls(l.ftr, 95, 90) + '">' + p1(l.ftr) + '</td><td>' + p1(l.dft) + '</td><td class="wrapc">' + esc(rem) + '</td></tr>';
      }).join('');
      tot = '<tr class="tot"><td>' + esc(unit) + '</td><td></td><td></td><td></td><td>' + n0(tp) + '</td><td>' + n0(tt) + '</td><td>' + p1(tt ? tp / tt * 100 : null) + '</td>' +
        (live ? '<td></td><td>' + p1(tex ? tpx / tex * 100 : null) + '</td><td></td>' : '<td>' + p1(ta ? te / ta * 100 : null) + '</td>') + '<td colspan="4"></td></tr></tbody></table>';
    }
    // product-wise with + drop-down of its lines
    var nCols = HOURLY ? 16 : 8;
    var prod = DR.products.length ? '<h3 class="sub2">Product-wise (buyer & style) <span class="m" style="font-weight:400;font-size:12px">- click + to see the lines running a style</span></h3><table class="prodt"><thead><tr><th style="width:34px"></th><th class="l">' + T('buyer') + '</th><th class="l">' + T('style') + '</th><th class="l">Lines</th>' +
      (HOURLY ? [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (h) { return '<th>H' + h + '</th>'; }).join('') : '') + '<th>' + T('output') + '</th><th>' + T('target') + '</th><th>' + (live ? 'Of day target' : T('achieved')) + '</th>' + (HOURLY ? '' : '<th>Share of unit output</th>') + '</tr></thead><tbody>' +
      DR.products.map(function (x, pi) {
        var a = x.tgt ? x.pro / x.tgt * 100 : null, key = x.buyer + '|' + x.style, open = !!OPENP[key];
        var plines = DR.lines.filter(function (l) { return x.lines.indexOf(l.line) > -1; });
        var ph = [0, 0, 0, 0, 0, 0, 0, 0, 0]; plines.forEach(function (l) { (l.hours || []).forEach(function (v, i) { ph[i] += v || 0; }); });
        var row = '<tr class="prow" data-k="' + esc(key) + '" style="cursor:pointer"><td><button type="button" class="pbtn" aria-expanded="' + open + '" title="' + (open ? 'Hide' : 'Show') + ' lines" style="width:26px;height:26px;padding:0;justify-content:center;font-weight:800">' + (open ? '&minus;' : '+') + '</button></td>' +
          '<td class="l">' + esc(x.buyer) + '</td><td class="l"><b>' + esc(x.style) + '</b></td><td class="l">' + x.lines.length + ' line' + (x.lines.length > 1 ? 's' : '') + ': ' + esc(x.lines.join(', ')) + '</td>' +
          (HOURLY ? ph.map(function (v) { return '<td>' + hcell(v) + '</td>'; }).join('') : '') +
          '<td><b>' + n0(x.pro) + '</b></td><td>' + n0(x.tgt) + '</td><td class="' + (live ? '' : cls(a, 98, 90)) + '">' + p1(a) + '</td>' + (HOURLY ? '' : '<td>' + p1(tp ? x.pro / tp * 100 : null) + '</td>') + '</tr>';
        if (open) {
          row += plines.map(function (l) {
            var st = (l.styles || []).filter(function (s2) { return s2.buyer + '|' + s2.style === key; })[0] || { pro: l.pro, tgt: l.tgt };
            var shared = (l.styles || []).length > 1;
            var exp = live && st.tgt && l.hoursDone ? st.tgt * l.hoursDone / 9 : null, pace = exp ? st.pro / exp * 100 : null;
            return '<tr style="background:rgba(33,150,243,.06)"><td></td><td class="l m">&nbsp;&nbsp;&#8627; Line</td><td class="l"><b>' + esc(l.line) + '</b>' + (l.status ? ' <span class="m">(' + esc(l.status) + ')</span>' : '') + (shared ? ' <span class="m" title="This line also runs another style">*shared</span>' : '') + '</td>' +
              '<td class="l">' + n0(l.mp) + ' ops' + (live ? ' · hour ' + (l.hoursDone || 0) + '/9 · pace <b class="' + cls(pace, 98, 90) + '">' + p1(pace) + '</b>' : '') + '</td>' +
              (HOURLY ? (l.hours || []).concat([0, 0, 0, 0, 0, 0, 0, 0, 0]).slice(0, 9).map(function (v) { return '<td>' + hcell(v) + '</td>'; }).join('') : '') +
              '<td>' + n0(st.pro) + '</td><td>' + n0(st.tgt) + '</td><td>' + p1(st.tgt ? st.pro / st.tgt * 100 : null) + '</td>' + (HOURLY ? '' : '<td>' + (live ? hbars(l.hours) : '') + '</td>') + '</tr>';
          }).join('');
        }
        return row;
      }).join('') + '</tbody></table>' : '';
    document.getElementById('drill').innerHTML = tools + (DR.lines.length ? '<h3 class="sub2" style="margin-top:0">Line-wise' + (HOURLY ? ' - hour by hour (pieces)' : '') + '</h3>' + head + body + tot : '<div class="msg">No DPR lines for ' + esc(unit) + ' on ' + dmy(date) + ' yet.</div>') + prod +
      (live ? '<p class="hint">Pace = output so far vs target x hours entered / 9. H1-H9 = pieces in the 1st to 9th hour from the DPR. *shared = the line also runs another style; its hourly pieces are for the whole line. Efficiency is not shown for today because the COT sheet is updated up to yesterday.</p>' : '') +
      (r.errors && r.errors.length ? '<p class="hint">' + esc(r.errors.join('; ')) + '</p>' : '') +
      '<p class="hint no-print"><a href="#" id="drillBack">' + T('back') + '</a></p>';
    document.getElementById('bUpd').onclick = function () { updateNow(); };
    document.getElementById('bHourly').onclick = function () { HOURLY = !HOURLY; renderDrill(); };
    var bk = document.getElementById('drillBack'); if (bk) bk.onclick = function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  }
  document.getElementById('drill').addEventListener('click', function (e) {
    var tr = e.target.closest('tr.prow'); if (!tr) return;
    var k = tr.getAttribute('data-k'); OPENP[k] = !OPENP[k]; renderDrill();
  });
  function updateNow() {
    var ub = document.getElementById('bUpd'); if (ub) { ub.disabled = true; ub.textContent = 'Updating…'; }
    if (MODE === 'last') { if (DR) openDrill(DR.unit, true, true); return; }
    var params = MODE === 'today' ? { action: 'today', fresh: 1 } : { action: 'prod_day', date: DAY, fresh: 1 };
    jsonp(params, function (r) { if (r && r.ok) PD = r; if (R) renderSummary(); loadedAt = Date.now(); tick(); if (DR) openDrill(DR.unit, true, true); }, 100000);
  }

  function loadProd(cb) {
    if (MODE === 'last') { PD = null; renderSummary(); return cb && cb(); }
    var params = MODE === 'today' ? { action: 'today' } : { action: 'prod_day', date: DAY };
    jsonp(params, function (r) {
      if (r && r.ok) { PD = r; } else if (!PD) { document.getElementById('sum').innerHTML = '<div class="msg">' + esc(r && r.error || T('tryAgain')) + '</div>'; }
      if (R) renderSummary();
      if (cb) cb();
    }, 100000);
  }
  function load() {
    document.getElementById('meta').textContent = T('loading');
    var pending = 2, first = !R;
    function both() { if (--pending) return; loadedAt = Date.now(); tick(); renderSummary(); if (first && ONLY) openDrill(ONLY); else if (DR) openDrill(DR.unit, true); }
    jsonp({ action: 'report' }, function (r) {
      if (!r || !r.ok) { document.getElementById('meta').textContent = T('tryAgain'); setTimeout(load, 60000); return; }
      R = r; both();
    }, 150000);
    loadProd(both);
    loadNotes();
  }
  function loadNotes() { jsonp({ action: 'notes' }, function (r) { if (r && r.ok) { NOTES = r.notes || []; renderNotes(); if (R) renderSummary(); } }, 60000); }
  function tick() { if (!loadedAt) return; var m = Math.floor((Date.now() - loadedAt) / 60000); document.getElementById('meta').textContent = (m < 1 ? T('updatedNow') : T('updatedMin', { n: m })) + (isLive() ? ' · live, refreshes every 5 min' : ''); }

  // day switch
  var modeSel = document.getElementById('mode'), dayInp = document.getElementById('day');
  modeSel.value = MODE; dayInp.hidden = MODE !== 'date'; if (DAY) dayInp.value = DAY;
  dayInp.max = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  modeSel.onchange = function () {
    MODE = this.value; dayInp.hidden = MODE !== 'date';
    if (MODE === 'date') { if (!dayInp.value) { dayInp.value = R ? R.p.date : ''; } DAY = dayInp.value; if (!DAY) return dayInp.focus(); }
    PD = null; renderSummary(); loadProd(function () { if (DR) openDrill(DR.unit, true); tick(); });
  };
  dayInp.onchange = function () { DAY = this.value; if (!DAY) return; PD = null; renderSummary(); loadProd(function () { if (DR) openDrill(DR.unit, true); }); };
  setInterval(function () { if (MODE === 'today' && !document.hidden) loadProd(function () { if (DR) openDrill(DR.unit, true); loadedAt = Date.now(); tick(); }); }, 5 * 60000);

  // ---------- Excel ----------
  function loadXlsx(cb) {
    if (window.XLSX) return cb();
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = cb; s.onerror = function () { alert('Could not load the Excel library. Check the internet connection.'); };
    document.head.appendChild(s);
  }
  function r1(v) { return v == null ? '' : Math.round(v * 10) / 10; }
  document.getElementById('btnXls').addEventListener('click', function () {
    if (!R) return;
    loadXlsx(function () {
      var wb = XLSX.utils.book_new(), k = R.k, p = R.p;
      var sum = [['TSPL Daily Report'], ['Output date', dmy(prodDate()) + (isLive() && PD ? ' (live as of ' + PD.time + ')' : ''), 'Efficiency date', dmy(k.effDate)], [],
        ['Unit', 'Output', 'Target', 'Achieved %', 'Efficiency %', 'This month eff %', 'Last month eff %', 'End-line FTR % (MTD)', 'FSA pass % (MTD)', 'FSA pass', 'FSA fail']];
      units().forEach(function (u) { var x = prodOf(u.unit);
        sum.push([u.unit, x.pro || 0, x.tgt || 0, x.tgt ? r1(x.pro / x.tgt * 100) : '', r1(u.eff), r1(u.effMtd), r1(u.effPrevMonth), r1(u.ftr), r1(u.fsa), u.fsaPass || 0, u.fsaFail || 0]); });
      var ws = XLSX.utils.aoa_to_sheet(sum); ws['!cols'] = [{ wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 11 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 19 }, { wch: 16 }, { wch: 9 }, { wch: 9 }];
      XLSX.utils.book_append_sheet(wb, ws, 'Summary');
      var tr = [['Unit', 'Date', 'Efficiency %']];
      Object.keys(k.trend || {}).forEach(function (u) { if (ONLY && u !== ONLY) return; k.trend[u].forEach(function (x) { tr.push([u, x.d, x.eff]); }); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tr), 'Efficiency trend');
      if (DR && DR.lines) {
        var dl = [['Unit', 'Date', 'Line', 'Buyer', 'Style', 'Output', 'Target', 'Achieved %', 'Operators', 'Efficiency %', 'FTR %', 'Defective %', 'Remark', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'H7', 'H8', 'H9']];
        DR.lines.forEach(function (l) { dl.push([DR.unit, DR.date, l.line, l.buyer || '', l.style || '', l.pro || 0, l.tgt || 0, l.tgt ? r1(l.pro / l.tgt * 100) : '', l.mp || '', r1(l.eff), r1(l.ftr), r1(l.dft), (/^(na|n\/a|-|0)$/i.test(String(l.remark || '').trim()) ? '' : l.remark || '')].concat((l.hours || []).concat([0,0,0,0,0,0,0,0,0]).slice(0, 9))); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dl), DR.unit + ' lines');
        if (DR.products && DR.products.length) { var pr = [['Unit', 'Date', 'Buyer', 'Style', 'Lines', 'Output', 'Target', 'Achieved %']]; DR.products.forEach(function (x) { pr.push([DR.unit, DR.date, x.buyer, x.style, x.lines.join(', '), x.pro, x.tgt, x.tgt ? r1(x.pro / x.tgt * 100) : '']); }); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pr), DR.unit + ' products'); }
      }
      var nt = [['Date', 'Unit', 'Line', 'Note', 'By']];
      NOTES.forEach(function (n) { if (!ONLY || n.unit === ONLY) nt.push([n.date, n.unit, n.line, n.text, n.by]); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(nt), 'Notes');
      XLSX.writeFile(wb, 'TSPL_Report_' + (ONLY ? ONLY + '_' : '') + (prodDate() || 'latest') + '.xlsx');
    });
  });
  document.getElementById('btnPdf').addEventListener('click', function () { window.print(); });
  document.getElementById('btnRe').addEventListener('click', function () { if (R) updateNow(); else load(); });
  document.getElementById('sum').addEventListener('click', function (e) { var tr = e.target.closest('tr[data-u]'); if (tr) openDrill(tr.getAttribute('data-u')); });

  // ---------- Notes form ----------
  var sel = document.getElementById('nUnit');
  sel.innerHTML = UNITS.map(function (u) { return '<option' + (u === ONLY ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '<option value="TSPL">' + T('allUnits') + '</option>';
  var d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000); document.getElementById('nDate').value = d.toISOString().slice(0, 10);
  try { document.getElementById('nBy').value = localStorage.getItem('tsplNoteBy') || ''; } catch (e) {}
  document.getElementById('noteForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = { action: 'addnote', unit: sel.value, line: document.getElementById('nLine').value.trim(), date: document.getElementById('nDate').value,
      text: document.getElementById('nText').value.trim(), by: document.getElementById('nBy').value.trim() };
    var fl = document.getElementById('nFlash'); fl.className = 'flash m'; fl.textContent = T('loading');
    try { localStorage.setItem('tsplNoteBy', f.by); } catch (er) {}
    jsonp(f, function (r) {
      if (r && r.ok) { fl.className = 'flash g'; fl.textContent = T('saved'); document.getElementById('nText').value = ''; document.getElementById('nLine').value = ''; loadNotes(); }
      else { fl.className = 'flash r'; fl.textContent = (r && r.error) || 'Error'; }
    }, 30000);
  });

  setInterval(tick, 30000);
  load();
})();
</script>
<script src="js/home-btn.js"></script>
</body>
</html>
