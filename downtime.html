<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSPL | Log downtime</title>
<link rel="icon" href="img/tsilfaviconn.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pro.css">
<style>
  .pro-main{max-width:820px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  form .full{grid-column:1/-1}
  form input,form select,form textarea{height:46px;border-radius:12px;border:1px solid #d5dce8;padding:0 12px;font:500 15px Inter,Arial;color:var(--text);background:#fff}
  form textarea{height:70px;padding:10px 12px;resize:vertical}
  .reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .reasons button{min-height:46px;border-radius:12px;border:1px solid #d5dce8;background:#fff;font:600 13px Inter,Arial;color:var(--text);cursor:pointer;padding:6px 10px;text-align:left}
  .reasons button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #f0f3f8}
  .flash{font-size:14px;font-weight:600}
  @media (max-width:560px){form{grid-template-columns:1fr}}
</style>
</head>
<body class="pro">
<header class="pro-top">
  <div class="brand">TSPL<span> Downtime</span></div>
  <div class="sp"><span class="small" id="who" style="color:#a9b8d0"></span></div>
</header>
<main class="pro-main">
  <section class="pro-card">
    <h2>Log a machine or line stop</h2>
    <form id="f">
      <label>Unit<select id="fUnit" required><option>AP2</option><option>FIPL</option><option>TS2</option><option>TS4</option><option>TS9</option></select></label>
      <label>Line<input id="fLine" required inputmode="numeric" maxlength="10" placeholder="e.g. 7"></label>
      <div class="full"><div class="small" style="font-weight:600;color:var(--muted);margin-bottom:6px">Reason</div><div class="reasons" id="reasons" role="group" aria-label="Reason"></div></div>
      <label>Machine (optional)<input id="fMc" maxlength="40" placeholder="e.g. SNLS #14"></label>
      <label>Started at<input id="fStart" type="time" required></label>
      <label>Ended at (leave empty if still stopped)<input id="fEnd" type="time"></label>
      <label class="full">Note (optional)<textarea id="fNote" maxlength="300" placeholder="What happened, who is fixing it"></textarea></label>
      <div class="full" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="pro-btn primary" type="submit" id="btnSave" style="height:48px;padding:0 22px">Save stop</button><span class="flash" id="flash"></span></div>
    </form>
  </section>
  <section class="pro-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Today's stops - <span id="lUnit"></span></h2><span class="chip warn" id="tot"></span></div>
    <div id="list" style="margin-top:6px"><div class="skel" style="height:60px"></div></div>
  </section>
</main>
<script src="js/tspl-config.js"></script>
<script src="js/tspl-app.js"></script>
<script src="js/home-btn.js"></script>
<script>
(function () {
  'use strict';
  var A = window.TSPL_APP, esc = A.esc, P = new URLSearchParams(location.search), reason = '';
  var REASONS = ['Machine breakdown', 'No input / feeding', 'Power cut', 'Style changeover', 'Quality issue / rework', 'Operator absent', 'Waiting for trims / accessories', 'Needle / attachment problem', 'Other'];
  function $(id) { return document.getElementById(id); }
  function hm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  var u = A.user();
  $('who').textContent = u ? (u.name || u.email) : 'Sign in needed to save';
  if (P.get('unit')) $('fUnit').value = P.get('unit').toUpperCase(); else if (u && u.unit && /^(AP2|FIPL|TS2|TS4|TS9)$/.test(u.unit)) $('fUnit').value = u.unit;
  if (P.get('line')) $('fLine').value = P.get('line');
  $('fStart').value = hm();
  $('reasons').innerHTML = REASONS.map(function (r) { return '<button type="button" data-r="' + esc(r) + '">' + esc(r) + '</button>'; }).join('');
  $('reasons').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; reason = b.dataset.r; [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); });
  $('fUnit').onchange = list;
  function flash(t, ok) { $('flash').textContent = t; $('flash').style.color = ok ? 'var(--good)' : 'var(--bad)'; }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!reason) return flash('Pick a reason.', false);
    $('btnSave').disabled = true; flash('Saving…', true);
    A.call({ action: 'dt_add', unit: $('fUnit').value, line: $('fLine').value.trim(), reason: reason, machine: $('fMc').value.trim(), start: $('fStart').value, end: $('fEnd').value, note: $('fNote').value.trim() }, function (r) {
      $('btnSave').disabled = false;
      if (!r) return flash('No connection - please try again.', false);
      if (!r.ok) return flash(r.error || 'Could not save', false);
      flash('Saved. It now shows on the floor screen and line page.', true);
      $('fMc').value = ''; $('fNote').value = ''; $('fEnd').value = ''; $('fStart').value = hm();
      list();
    });
  });
  function list() {
    var un = $('fUnit').value; $('lUnit').textContent = un;
    A.jsonp({ action: 'dt_list', unit: un }, function (r) {
      if (!r || !r.ok) { $('list').innerHTML = '<div class="empty">Could not load the list.</div>'; return; }
      $('tot').textContent = r.total + ' min in total';
      $('list').innerHTML = r.list.length ? r.list.map(function (x) {
        return '<div class="row"><div><b>Line ' + esc(x.line) + '</b> · ' + esc(x.reason) + (x.machine ? ' · ' + esc(x.machine) : '') +
          '<div class="small muted">' + esc(x.start) + (x.end ? ' - ' + esc(x.end) : ' - still stopped') + (x.note ? ' · ' + esc(x.note) : '') + ' · by ' + esc(x.by) + '</div></div>' +
          '<div style="display:flex;gap:8px;align-items:center"><span class="chip ' + (x.open ? 'bad' : 'warn') + '">' + (x.mins || 0) + ' min</span>' +
          (x.open ? '<button class="pro-btn" type="button" data-end="' + esc(x.id) + '">Running again</button>' : '') + '</div></div>';
      }).join('') : '<div class="empty">No stops logged today.</div>';
    });
  }
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-end]'); if (!b) return;
    b.disabled = true; b.textContent = 'Saving…';
    A.call({ action: 'dt_end', id: b.dataset.end, end: hm() }, function (r) { if (!r || !r.ok) { b.disabled = false; b.textContent = 'Try again'; return; } list(); });
  });
  list(); setInterval(list, 60000);
})();
</script>
</body>
</html>
