<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>TSPL | Attendance</title>
<link rel="icon" href="img/tsilfaviconn.png" type="image/png" sizes="32x32">
<style>
:root{--bg:#F4F6FA;--card:#fff;--line:#E2E8F0;--ink:#0F172A;--mute:#475569;--navy:#0B2545;--gold:#C8962E;--g:#15803D;--a:#B45309;--r:#B91C1C;--b:#1D4ED8;--soft:#F8FAFC}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:76px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:6}
.hw{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:17px}.brand h1 span{color:var(--gold)}.brand .sub{font-size:12px;color:#CBD5E1}
.hb{height:36px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.hb.gold{background:var(--gold);border-color:var(--gold);color:#0B2545}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl select,.ctl input{height:36px;border-radius:8px;border:0;padding:0 10px;font:inherit}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 18px 8px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#CBD5E1;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--navy)}
main{max-width:1280px;margin:0 auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--c,#0B2545)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}.kpi .v{font-size:24px;font-weight:700;margin:4px 0 2px}.kpi .n{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.card h2 small{font-weight:400;color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.unit{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.unit:hover{border-color:#94A3B8}
.unit b{font-size:16px}.pbar{height:8px;border-radius:99px;background:#EEF2F7;overflow:hidden;display:flex;margin:8px 0 6px}.pbar i{display:block;height:100%}
.tw{overflow:auto}table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--mute);text-align:right;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:1}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th.l,td.l{text-align:left}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.tP{background:#DCFCE7;color:#166534}.tA{background:#FEE2E2;color:#991B1B}.tL{background:#DBEAFE;color:#1E40AF}.tHD{background:#FEF3C7;color:#92400E}.tN{background:#EEF2F7;color:#475569}.tY{background:#DCFCE7;color:#166534}.tNo{background:#FEE2E2;color:#991B1B}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid #CBD5E1;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn:disabled{opacity:.5;cursor:default}
.inp,select.inp{height:38px;border:1px solid #CBD5E1;border-radius:8px;padding:0 10px;font:inherit;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wk .who{flex:1;min-width:0}.wk .who b{display:block;font-size:14px}.wk .who span{font-size:12px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid #CBD5E1;border-radius:9px;overflow:hidden;flex:none}
.seg button{height:40px;min-width:44px;border:0;border-right:1px solid #CBD5E1;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:#475569}
.seg button:last-child{border-right:0}
.seg button.on.P{background:#16A34A;color:#fff}.seg button.on.A{background:#DC2626;color:#fff}.seg button.on.L{background:#2563EB;color:#fff}.seg button.on.HD{background:#D97706;color:#fff}
.hint{font-size:12px;color:var(--mute)}.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
.load{padding:50px;text-align:center;color:var(--mute)}.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;border:2px dashed #CBD5E1;border-radius:12px;color:var(--mute)}
.sample{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.bars i{width:70%;max-width:26px;border-radius:4px 4px 0 0;background:#1D4ED8}.bars small{font-size:10px;color:var(--mute)}
#dlg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20;align-items:center;justify-content:center;padding:14px}
#dlg .box{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:18px;max-height:92vh;overflow:auto}
#dlg label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}#dlg .inp{width:100%}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:none;z-index:7;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.savebar .in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media(max-width:640px){.hw{padding:8px 12px}main{padding:12px}.kpi .v{font-size:20px}.brand h1{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="hw">
    <div class="brand"><a id="homeBtn" class="hb gold" href="index.html">&#8962;</a><div><h1>TSPL <span>Attendance</span></h1><div class="sub" id="sub">Loading…</div></div></div>
    <div class="ctl"><select id="unit" aria-label="Factory"></select><input type="date" id="date" aria-label="Date"><button class="hb" id="btnRefresh" type="button">Refresh</button><button class="hb" id="btnOut" type="button">Log out</button></div>
  </div>
  <nav class="tabs" id="tabs"><button data-t="home" class="on">Home</button><button data-t="mark">Mark attendance</button><button data-t="workers">Workers</button><button data-t="reports">Reports</button><button data-t="alerts">Alerts</button></nav>
</header>
<main id="app"><div class="load"><div class="spin"></div>Loading…</div></main>
<div class="savebar" id="savebar"><div class="in"><span id="saveInfo">0 changes</span><span class="row"><button class="btn" id="btnUndo" type="button">Undo changes</button><button class="btn pri" id="btnSave" type="button">Save attendance</button></span></div></div>
<div id="dlg" role="dialog" aria-modal="true"><div class="box" id="dlgBox"></div></div>
<script src="security.js"></script>
<script src="js/tspl-config.js?v=20261122e"></script>
<script>
(function () {
  'use strict';
  var U = {}; try { U = JSON.parse(sessionStorage.getItem('userLoggedIn') || '{}'); } catch (e) {}
  var KEY = sessionStorage.getItem('attKey') || '', USER = U.username || '';
  var MAP = { hohr: 'ALL', hr_fipl: 'FIPL', hr_ts2: 'TS2', hr_ts4: 'TS4', hr_ts9: 'TS9', hr_ap2: 'AP2' };
  var MYUNIT = MAP[USER] || (U.redirect === 'att.html' ? 'ALL' : 'ALL');
  var CAN = !!(KEY && MAP[USER]);                     // HR logins can mark / edit; others (HO viewers) read-only
  var IS_APP = U.redirect === 'att.html';
  (function () { var h = document.getElementById('homeBtn'); if (IS_APP) { h.style.display = 'none'; } else { document.getElementById('btnOut').style.display = 'none'; h.href = window.top !== window.self ? 'home.html' : (U.redirect || 'main_ho.html'); h.innerHTML = '&#8962; Home'; } })();
  document.getElementById('btnOut').addEventListener('click', function () { sessionStorage.clear(); location.href = 'index.html'; });
  var UNITS = ['FIPL', 'TS2', 'TS4', 'TS9', 'AP2'];
  var today = new Date(), iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var S = { tab: 'home', unit: MYUNIT, date: iso(today), day: null, trend: null, edits: {}, q: '', line: '', filter: '', sample: false, rep: null };
  var uSel = document.getElementById('unit');
  uSel.innerHTML = (MYUNIT === 'ALL' ? '<option value="ALL">All factories</option>' + UNITS.map(function (u) { return '<option>' + u + '</option>'; }).join('') : '<option>' + MYUNIT + '</option>');
  uSel.value = S.unit; document.getElementById('date').value = S.date; document.getElementById('date').max = S.date;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function jsonp(params, cb) {
    var name = '__att' + Date.now() + Math.floor(Math.random() * 1e5), s = document.createElement('script'), done = false;
    window[name] = function (r) { done = true; window[name] = function () {}; cb(r); };
    s.src = (window.TSPL_MONITOR_URL || '') + '?' + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&') + '&callback=' + name + '&_=' + Date.now();
    s.onerror = function () { if (!done) { done = true; cb(null); } };
    setTimeout(function () { if (!done) { done = true; window[name] = function () {}; cb(null); } }, 90000);
    document.body.appendChild(s);
  }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dl(d) { return d.slice(8, 10) + '-' + MON[+d.slice(5, 7) - 1]; }
  function kpi(l, v, n, col) { return '<div class="kpi" style="--c:' + col + '"><div class="l">' + l + '</div><div class="v" style="color:' + col + '">' + v + '</div><div class="n">' + n + '</div></div>'; }
  var STN = { P: 'Present', A: 'Absent', L: 'Leave', HD: 'Half day' };
  function stTag(s) { return s ? '<span class="tag t' + s + '">' + STN[s] + '</span>' : '<span class="tag tN">Not marked</span>'; }
  function repTag(w) { return /^y/i.test(w.reply) ? '<span class="tag tY">Said coming</span>' : /^n/i.test(w.reply) ? '<span class="tag tNo">Not coming' + (w.why ? ' · ' + esc(w.why) : '') + '</span>' : (w.tg ? '<span class="tag tN">No reply</span>' : '<span class="hint">Not on Telegram</span>'); }
  function eff(w) { return S.edits[w.code] != null ? S.edits[w.code] : w.st; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  /* ---------- sample preview (only shown, never saved) ---------- */
  function sampleDay() {
    var lines = { FIPL: ['1', '2', '3'], TS2: ['1', '4'], TS4: ['5', '6', '7'], TS9: ['8', '9'], AP2: ['1', '2'] }, out = [], n = 0, rs = ['Sick', 'Personal work', 'Family function'];
    (S.unit === 'ALL' ? UNITS : [S.unit]).forEach(function (u) { lines[u].forEach(function (l) { for (var i = 1; i <= 8; i++) { n++; var r = (n * 37) % 10; out.push({ code: 'S' + u + l + i, name: 'Sample worker ' + n, unit: u, line: l, shift: 'G', mobile: '', dept: 'Sewing', desig: 'Tailor', tg: r !== 9, reply: r < 7 ? 'Yes' : r < 9 ? 'No' : '', why: r >= 7 && r < 9 ? rs[n % 3] : '', st: r < 6 ? 'P' : r === 7 ? 'A' : '', sr: '', by: '' }); } }); });
    return { ok: true, unit: S.unit, date: S.date, working: true, workers: out };
  }

  function load(fresh) {
    if (S.tab === 'reports') return loadReport();
    document.getElementById('app').innerHTML = '<div class="load"><div class="spin"></div>Loading attendance…</div>';
    var n = 2, done = function () { if (--n === 0) render(); };
    jsonp({ action: 'att_day', unit: S.unit, date: S.date }, function (r) { S.day = r && r.ok ? r : { ok: false, error: r && r.error, workers: [] }; done(); });
    var p = { action: 'att_trend', unit: S.unit, days: 14 }; if (fresh) p.fresh = 1;
    jsonp(p, function (r) { S.trend = r && r.ok ? r : null; done(); });
  }
  function day() { return S.sample ? sampleDay() : S.day; }
  function counts(ws) { var c = { head: ws.length, P: 0, A: 0, L: 0, HD: 0, N: 0, yes: 0, no: 0, nr: 0, tg: 0 };
    ws.forEach(function (w) { var s = eff(w); if (s) c[s]++; else c.N++; if (/^y/i.test(w.reply)) c.yes++; else if (/^n/i.test(w.reply)) c.no++; else if (w.tg) c.nr++; if (w.tg) c.tg++; });
    c.pres = c.P + c.HD * 0.5; c.pct = pct(c.pres, c.head - c.N > 0 ? c.head - c.N : 0); return c; }
  function render() {
    var D = day();
    document.getElementById('sub').textContent = (S.unit === 'ALL' ? 'All factories' : S.unit) + ' · ' + dl(S.date) + ' ' + S.date.slice(0, 4) + (CAN ? ' · ' + USER : ' · view only') + (S.sample ? ' · SAMPLE PREVIEW' : '');
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.className = b.getAttribute('data-t') === S.tab ? 'on' : ''; });
    if (!D || D.ok === false) { document.getElementById('app').innerHTML = '<div class="load">Could not load attendance' + (D && D.error ? ': ' + esc(D.error) : '') + '. Press Refresh.</div>'; return; }
    var h = S.sample ? '<div class="sample">Sample preview: made-up workers to show how the app works. Nothing here is saved. <button class="btn" data-act="nosample" type="button" style="height:30px;margin-left:8px">Exit preview</button></div>' : '';
    if (!D.workers.length && !S.sample && S.tab !== 'workers') { h += emptyState(); document.getElementById('app').innerHTML = h; return; }
    h += ({ home: viewHome, mark: viewMark, workers: viewWorkers, alerts: viewAlerts }[S.tab] || viewHome)(D);
    document.getElementById('app').innerHTML = h; bar();
  }
  function emptyState() {
    return '<div class="card"><div class="empty"><h2 style="justify-content:center">No workers yet</h2><p>Add the workers list to start. Download the template, fill it (or use your own Excel with the same column names) and import it.</p><div class="row" style="justify-content:center">' +
      (CAN ? '<button class="btn pri" data-act="import" type="button">Import workers Excel</button>' : '') + '<button class="btn" data-act="template" type="button">Download template</button><button class="btn" data-act="sample" type="button">Preview with sample data</button></div></div></div>';
  }
  function viewHome(D) {
    var c = counts(D.workers), h = '';
    if (D.working === false) h += '<div class="sample" style="background:#EEF2F7;color:#334155;border-color:#CBD5E1">' + dl(S.date) + ' is a holiday / weekly off.</div>';
    h += '<div class="kpis">' + kpi('Headcount', c.head, 'active workers', '#0B2545') + kpi('Present', c.P + (c.HD ? ' + ' + c.HD + ' half' : ''), c.pct + '% of marked', '#15803D') + kpi('Absent', c.A, 'marked by HR', '#B91C1C') + kpi('Leave', c.L, 'approved leave', '#1D4ED8') + kpi('Not marked', c.N, CAN ? 'still to mark' : 'HR still to mark', c.N ? '#B45309' : '#15803D') +
      kpi('Telegram replies', c.yes + ' / ' + c.no, 'coming / not coming · ' + c.nr + ' no reply', '#7C3AED') + '</div>';
    if (S.unit === 'ALL') {
      var bu = {}; D.workers.forEach(function (w) { (bu[w.unit] = bu[w.unit] || []).push(w); });
      h += '<section class="card"><h2>Factories today <small>tap a factory to open it</small></h2><div class="units">' + UNITS.concat(Object.keys(bu).filter(function (u) { return UNITS.indexOf(u) < 0; })).filter(function (u) { return bu[u]; }).map(function (u) { var k = counts(bu[u]), w = function (v) { return k.head ? v / k.head * 100 + '%' : 0; };
        return '<div class="unit" data-unit="' + u + '"><div class="row" style="justify-content:space-between"><b>' + u + '</b><span class="' + (k.pct >= 90 ? 'g' : k.pct >= 80 ? 'a' : 'r') + '" style="font-weight:700">' + (k.head - k.N ? k.pct + '%' : '–') + '</span></div><div class="pbar"><i style="width:' + w(k.P) + ';background:#16A34A"></i><i style="width:' + w(k.HD) + ';background:#F59E0B"></i><i style="width:' + w(k.L) + ';background:#3B82F6"></i><i style="width:' + w(k.A) + ';background:#EF4444"></i></div><div class="hint">' + k.head + ' workers · ' + k.P + ' P · ' + k.A + ' A · ' + k.L + ' L · ' + k.N + ' not marked</div><div class="hint">Telegram: ' + k.yes + ' coming · ' + k.no + ' not coming</div></div>'; }).join('') + '</div></section>';
    }
    // trend
    var T = S.trend, bars = '';
    if (T && !S.sample) { bars = T.days.map(function (d) { var P = 0, HD = 0, m = 0; Object.keys(T.data).forEach(function (k) { if (k.indexOf(d + '|') === 0) { var o = T.data[k]; P += o.P; HD += o.HD; m += o.P + o.A + o.L + o.HD; } }); var v = m ? (P + HD / 2) / m * 100 : 0;
      return '<div title="' + dl(d) + ': ' + (m ? Math.round(v) + '%' : 'not marked') + '"><span class="hint" style="font-size:10px">' + (m ? Math.round(v) : '') + '</span><i style="height:' + (m ? Math.max(4, v) : 2) + '%;background:' + (!m ? '#E2E8F0' : v >= 90 ? '#16A34A' : v >= 80 ? '#F59E0B' : '#EF4444') + '"></i><small>' + d.slice(8) + '</small></div>'; }).join(''); }
    var bl = {}; D.workers.forEach(function (w) { var k = (S.unit === 'ALL' ? w.unit + ' · ' : '') + (w.line ? 'Line ' + w.line : 'No line'); (bl[k] = bl[k] || []).push(w); });
    h += '<div class="grid2"><section class="card"><h2>Attendance % · last 14 days <small>present ÷ marked</small></h2>' + (bars ? '<div class="bars">' + bars + '</div>' : '<div class="hint">Shows once attendance is marked for a few days.</div>') + '</section>' +
      '<section class="card"><h2>' + (S.unit === 'ALL' ? 'By factory and line' : 'By line') + '</h2><div class="tw" style="max-height:300px"><table><thead><tr><th class="l">Line</th><th>Workers</th><th>P</th><th>A</th><th>L</th><th>Not marked</th><th>%</th></tr></thead><tbody>' +
      Object.keys(bl).sort().map(function (k) { var c2 = counts(bl[k]); return '<tr><td class="l"><b>' + esc(k) + '</b></td><td>' + c2.head + '</td><td class="g">' + c2.P + '</td><td class="r">' + c2.A + '</td><td>' + c2.L + '</td><td class="a">' + c2.N + '</td><td><b>' + (c2.head - c2.N ? c2.pct + '%' : '–') + '</b></td></tr>'; }).join('') + '</tbody></table></div></section></div>';
    var no = D.workers.filter(function (w) { return /^n/i.test(w.reply); });
    if (no.length) h += '<section class="card"><h2>Said not coming today (Telegram) <small>' + no.length + '</small></h2><div class="tw"><table><thead><tr><th class="l">Worker</th><th class="l">Factory · line</th><th class="l">Reason</th><th class="l">Replied</th><th class="l">HR status</th></tr></thead><tbody>' +
      no.map(function (w) { return '<tr><td class="l"><b>' + esc(w.name) + '</b> <span class="hint">' + esc(w.code) + '</span></td><td class="l">' + esc(w.unit) + ' · ' + esc(w.line) + '</td><td class="l">' + esc(w.why) + '</td><td class="l">' + esc(w.rt) + '</td><td class="l">' + stTag(eff(w)) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
    return h;
  }
  function viewMark(D) {
    var ws = D.workers, lines = {}; ws.forEach(function (w) { lines[(S.unit === 'ALL' ? w.unit + ' · ' : '') + w.line] = 1; });
    var list = ws.filter(function (w) { var lk = (S.unit === 'ALL' ? w.unit + ' · ' : '') + w.line; return (!S.line || lk === S.line) && (!S.q || (w.name + ' ' + w.code + ' ' + w.mobile).toLowerCase().indexOf(S.q) > -1) && (!S.filter || (S.filter === 'N' ? !eff(w) : eff(w) === S.filter)); });
    var c = counts(ws);
    var h = '<section class="card"><h2>Mark attendance · ' + dl(S.date) + ' <small>' + c.head + ' workers · ' + (c.head - c.N) + ' marked · ' + c.N + ' to mark</small></h2>' +
